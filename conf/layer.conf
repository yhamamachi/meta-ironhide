# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ironhide"
BBFILE_PATTERN_ironhide = "^${LAYERDIR}/"
BBFILE_PRIORITY_ironhide = "6"
LAYERSERIES_COMPAT_ironhide = "scarthgap"

LAYERDEPENDS_ironhide = "core yocto yoctobsp openembedded-layer meta-python networking-layer"

